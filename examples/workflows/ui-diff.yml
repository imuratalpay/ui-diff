# Copy to .github/workflows/ui-diff.yml in the app repository.
# Assumes the skill is committed to the app repo (./install.sh --claude --project <app>), so CI
# needs no access to the private ui-diff repository.
name: ui-diff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Optional: let GitHub skip the whole workflow when no file that can change the UI changed.
    # The list mirrors ui-diff's detect.include defaults plus the dependency files and the config;
    # keep it in sync if you change detect.include. Two caveats: a required check whose workflow
    # GitHub skips this way stays "Expected" and blocks the merge (the preflight job below has no
    # such problem), and a PR that drops its last UI change keeps its old ui-diff comment.
    # paths:
    #   - '**/*.{html,htm,css,scss,sass,less,styl,pcss,vue,svelte,astro,jsx,tsx,mdx,js,ts,mjs,cjs}'
    #   - '**/*.{svg,png,jpg,jpeg,gif,webp,avif,ico,woff,woff2,ttf,otf}'
    #   - '**/*.json'
    #   - '**/{pnpm-lock.yaml,yarn.lock,bun.lock,bun.lockb}'

permissions:
  contents: write # push screenshots to the ui-diff-assets branch of this repository
  pull-requests: write # create / update the sticky comment

concurrency:
  group: ui-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SKILL: .claude/skills/ui-diff
  GH_TOKEN: ${{ github.token }}

jobs:
  # Decides whether anything needs capturing. Needs only git history and ui-diff's own
  # dependencies: no app install and no browser, so a PR without UI changes costs seconds.
  preflight:
    # Fork PRs get a read-only token; skip them instead of using pull_request_target,
    # which would run untrusted code with a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.detect.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ui-diff-npm-${{ hashFiles(format('{0}/package-lock.json', env.SKILL)) }}

      - name: Install ui-diff (no app dependencies, no browser)
        run: npm --prefix "$SKILL" ci --no-audit --no-fund

      # status: "capture" (routes to capture), "nothing-mapped" (UI files that match no route)
      # or "no-ui-changes".
      - name: Detect changed UI
        id: detect
        run: |
          node "$SKILL/bin/ui-diff.mjs" detect --quiet \
            --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/detect.json"
          echo "status=$(jq -r .status "$RUNNER_TEMP/detect.json")" >> "$GITHUB_OUTPUT"

      # Nothing to capture, so the run ends here, successfully. run stops after detection (no app,
      # no browser). publish then posts nothing when no UI file changed, updates an existing
      # comment to say so, or posts "nothing checked" for UI files that match no route.
      - name: Report without capturing
        if: steps.detect.outputs.status != 'capture'
        run: |
          node "$SKILL/bin/ui-diff.mjs" run --quiet \
            --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"
          node "$SKILL/bin/ui-diff.mjs" publish --quiet --pr ${{ github.event.pull_request.number }}

  ui-diff:
    needs: preflight
    if: needs.preflight.outputs.status == 'capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The app's package manager is picked from its lockfile (pnpm, yarn, bun or npm).
      # The skill itself always installs with npm from its own package-lock.json.
      - name: Detect the package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then echo "name=yarn" >> "$GITHUB_OUTPUT"; echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then echo "name=bun" >> "$GITHUB_OUTPUT"; echo "install=bun install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else echo "name=npm" >> "$GITHUB_OUTPUT"; echo "install=npm ci" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm / yarn through Corepack
        if: steps.pm.outputs.name == 'pnpm' || steps.pm.outputs.name == 'yarn'
        run: corepack enable

      - uses: oven-sh/setup-bun@v2
        if: steps.pm.outputs.name == 'bun'

      # The only dependency install of the run for each lockfile. ui-diff's base and head worktrees
      # reuse it when their lockfile matches this checkout: symlinked node_modules, or for Next.js
      # (Turbopack refuses symlinks out of the project) a copy made of hard links. Head is this
      # checkout, so only a PR that changes the lockfile makes base install once more; that
      # install reads the package manager's cache (~/.npm, the pnpm store, the yarn cache) filled
      # by this step.
      - name: Install app dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Install ui-diff and Chromium
        run: |
          npm --prefix "$SKILL" ci --no-audit --no-fund
          npx --prefix "$SKILL" playwright install --with-deps chromium

      - name: Capture and diff
        run: >
          node "$SKILL/bin/ui-diff.mjs" run
          --base "origin/${{ github.base_ref }}"
          --head "${{ github.event.pull_request.head.sha }}"
        # Protected previews instead of local worktrees:
        #   --base-url https://app-git-main-acme.vercel.app --head-url ${{ steps.preview.outputs.url }}
        # env:
        #   VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Publish the sticky comment
        run: node "$SKILL/bin/ui-diff.mjs" publish --pr ${{ github.event.pull_request.number }}

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-diff-report
          path: .ui-diff
          retention-days: 14
